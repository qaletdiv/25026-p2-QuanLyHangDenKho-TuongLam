# CodeDeploy (EC2 / on-premises). Bundle = buildspec.yml artifacts.
# Host-only files are NOT in the bundle and survive every deploy:
#   /opt/tentree-scportal/.env                      (JWT_SECRET, POSTGRES_*, PUBLIC_URL)
#   /opt/tentree-scportal/backend/.env              (NetSuite, FedEx, SMTP…)
#   /opt/tentree-scportal/nginx/opt/nginx/ssl/*     (Cloudflare origin cert + key)
version: 0.0
os: linux
files:
  - source: /
    destination: /opt/tentree-scportal
file_exists_behavior: OVERWRITE
hooks:
  BeforeInstall:
    - location: deploy/hooks/before_install.sh
      timeout: 120
      runas: root
  ApplicationStart:
    - location: deploy/hooks/start.sh
      timeout: 900
      runas: root
  ValidateService:
    - location: deploy/hooks/validate.sh
      timeout: 300
      runas: root
