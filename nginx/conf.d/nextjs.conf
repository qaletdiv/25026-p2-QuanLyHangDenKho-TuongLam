server {
    listen 443 ssl;
    http2 on;
    server_name excel.qzz.io;

    ssl_certificate     /etc/nginx/ssl/origin.pem;
    ssl_certificate_key /etc/nginx/ssl/origin.key;

    ssl_protocols TLSv1.2 TLSv1.3;

    # Shipping-data / NRI workbook uploads. nginx defaults to 1m (→ 413); Next's
    # server actions accept up to 20mb (next.config.ts bodySizeLimit).
    client_max_body_size 25m;

    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # The NetSuite syncs run inside the request and can take minutes.
        # (Cloudflare's own proxy limit is 100s on non-Enterprise plans.)
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
