# Local rehearsal of the production stack: postgres → backend → frontend → nginx (self-signed TLS).
#
#   docker compose -f docker-compose.local.yml up -d --build
#   (db-init seeds an EMPTY database from backend/database/seed-data automatically;
#    to reseed: docker compose -f docker-compose.local.yml down -v, then up again)
#   open https://localhost   (accept the self-signed certificate)
#
# The backend here is ALSO the local dev backend for `next dev` on :3000 (published
# on 127.0.0.1:5000). ⚠ It loads backend/.env, which carries PRODUCTION NetSuite
# credentials and LANDED_COST_NS_PUSH=enabled — exactly what the hand-started dev
# backend always ran with: the cron syncs live NetSuite into this local database,
# and mail follows the .env allowlist. Run only ONE backend (not also a Windows
# `node src/server.js`), or the crons run twice.
name: tentree-local

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tentree_portal
      POSTGRES_USER: tentree
      POSTGRES_PASSWORD: local-only-password
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432" # psql from the host
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tentree -d tentree_portal"]
      interval: 5s
      timeout: 5s
      retries: 20

  db-init:
    build:
      context: ./backend
    image: tentree-local-backend:latest
    restart: "no"
    command: ["node", "database/init.js", "--all", "--if-empty"]
    environment:
      DATABASE_URL: postgres://tentree:local-only-password@postgres:5432/tentree_portal
    depends_on:
      postgres:
        condition: service_healthy

  # Also THE local dev backend (2026-10-08): published on 127.0.0.1:5000 for the
  # `next dev` frontend on :3000, with restart: unless-stopped. A node process
  # started by hand on Windows kept dying from a stray Ctrl+C (its log ended in
  # ^C), which read as "all the data is gone". It loads backend/.env — the same
  # settings the hand-started dev backend used (incl. NetSuite + SMTP, so the
  # cron syncs and the mail allowlist behave as before) — and the JWT_SECRET there
  # must match frontend/tentree-scportal/.env.local, or :3000 can't verify logins.
  # Rebuild after backend code changes:  docker compose -f docker-compose.local.yml up -d --build backend
  backend:
    build:
      context: ./backend
    image: tentree-local-backend:latest
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgres://tentree:local-only-password@postgres:5432/tentree_portal
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - uploads:/app/storage/uploads
      - outbox:/app/storage/outbox
      - nri_billing:/app/storage/reference/nri-billing
    depends_on:
      db-init:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend/tentree-scportal
      args:
        NEXT_PUBLIC_API_URL: http://backend:5000
        NEXT_DEPLOYMENT_ID: ${NEXT_DEPLOYMENT_ID:-}
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://backend:5000
    # Same JWT_SECRET as the backend (both read the dev .env files).
    env_file:
      - ./frontend/tentree-scportal/.env.local
    depends_on:
      backend:
        condition: service_healthy

  nginx:
    build:
      context: ./nginx.local
    ports:
      - "443:443"
    volumes:
      - ./nginx.local/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx.local/conf.d:/etc/nginx/conf.d:ro
      - ./nginx.local/opt/nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx.local/logs:/var/log/nginx:rw
    depends_on:
      - frontend

volumes:
  pgdata:
  uploads:
  outbox:
  nri_billing:
